cat <<'EOF'> /var/log/logview.html
  <!DOCTYPE html>
  <html>

  <head>
    <meta charset="utf-8">
    <title>Postboot Log Viewer</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font-family: monospace;
        padding: 1em;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>

  <body>
    <h2>Postboot Log</h2>
    <pre id="log">Loading log...</pre>
    <script>
      async function loadLog() {
        const res = await fetch('postboot.txt?ts=' + new Date().getTime());
        const log = await res.text();
        document.getElementById('log').textContent = log;
      }
      setInterval(loadLog, 2000); // Refresh every 2 seconds
      loadLog();
    </script>
  </body>

  </html>
  EOF
